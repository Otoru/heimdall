nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/otoru/heimdall
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Ignored when autoscaling.enabled is true; the HPA owns the replica count.
replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: heimdall.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Required when autoscaling.enabled is true: utilization targets are a
# percentage of the request, so an HPA without requests never scales.
resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Recommended alongside autoscaling so a node drain cannot take every replica
# at once. Only rendered when enabled.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

env:
  SERVER_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  # S3_BUCKET is required
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
  S3_USE_PATH_STYLE: "false"
  S3_PREFIX: ""
  AUTH_USERNAME: ""
  AUTH_PASSWORD: ""
  AUTH_API_KEY_ENDPOINT: ""
  # AUTH_API_KEY_TOKEN should be injected via envSecrets, not here.
  # Example:
  #   envSecrets:
  #     AUTH_API_KEY_TOKEN:
  #       name: heimdall-auth
  #       key: api-key-token
  CHECKSUM_SCAN_INTERVAL: "30m"
  CHECKSUM_SCAN_PREFIX: ""
  # Only one replica runs the checksum scan per interval. The scan is
  # idempotent, so this is a cost optimisation rather than a correctness
  # requirement; set to "false" to have every replica scan.
  SCANNER_LEADER_ELECTION: "true"
  # How long the proxy definition list is reused before being reloaded, and
  # how long a stale list keeps being served if a reload fails. Definitions
  # only change by operator action, so serving a slightly stale list beats
  # failing requests while the object store is unhappy.
  PROXY_CACHE_TTL: "30s"
  PROXY_CACHE_STALE_GRACE: "15m"
  # Retries for upstream GET/HEAD on transport errors, 429 and 5xx.
  UPSTREAM_RETRY_ATTEMPTS: "3"
  UPSTREAM_TIMEOUT: "60s"
  # Validate fetched artifacts against the checksum upstream publishes before
  # caching them, so a bad download is retried instead of cached forever.
  VERIFY_UPSTREAM_CHECKSUMS: "true"
  # S3_ACCESS_KEY and S3_SECRET_KEY should be injected via envSecrets, not here.
  # Example:
  #   envSecrets:
  #     S3_ACCESS_KEY:
  #       name: heimdall-s3-credentials
  #       key: access-key
  #     S3_SECRET_KEY:
  #       name: heimdall-s3-credentials
  #       key: secret-key

envConfigMaps: {}

envSecrets: {}

nodeSelector: {}

tolerations: []

affinity: {}
