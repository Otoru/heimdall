nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/otoru/heimdall
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: heimdall.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

env:
  SERVER_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  # S3_BUCKET is required
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
  S3_USE_PATH_STYLE: "false"
  S3_PREFIX: ""
  AUTH_USERNAME: ""
  AUTH_PASSWORD: ""
  AUTH_API_KEY_ENDPOINT: ""
  # AUTH_API_KEY_TOKEN should be injected via envSecrets, not here.
  # Example:
  #   envSecrets:
  #     AUTH_API_KEY_TOKEN:
  #       name: heimdall-auth
  #       key: api-key-token
  CHECKSUM_SCAN_INTERVAL: "30m"
  CHECKSUM_SCAN_PREFIX: ""
  # S3_ACCESS_KEY and S3_SECRET_KEY should be injected via envSecrets, not here.
  # Example:
  #   envSecrets:
  #     S3_ACCESS_KEY:
  #       name: heimdall-s3-credentials
  #       key: access-key
  #     S3_SECRET_KEY:
  #       name: heimdall-s3-credentials
  #       key: secret-key

envConfigMaps: {}

envSecrets: {}

nodeSelector: {}

tolerations: []

affinity: {}
